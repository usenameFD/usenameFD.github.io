project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.ipynb"

website:
  title: "Franck Deba - Quantitative Research"
  favicon: img/logo-bg.png
  back-to-top-navigation: true
  navbar:
    logo: img/logo-bg.png
    left:
      - href: index.qmd
        text: Accueil
      - href: index_stat.qmd
        text: Modélisation Stat.
      - href: index_gdr.qmd
        text: Gestion des Risques
      - href: about.qmd
        text: À propos

# On désactive l’exécution globale
execute:
  enabled: false
  # ... mais PAS pour les notebooks !
  exclude: 
    - "*.ipynb"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "Sommaire"
    code-fold: true
    code-summary: "Afficher le code"
    df-print: paged

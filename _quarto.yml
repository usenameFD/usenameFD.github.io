project:
  type: website
  output-dir: docs

website:
  title: "Franck Deba - Quantitative Research"
  favicon: img/logo-bg.png
  back-to-top-navigation: true

  navbar:
    logo: img/logo-bg.png
    left:
      - href: index.qmd
        text: Accueil
      - href: index_stat.qmd
        text: Modélisation Stat.
      - href: index_gdr.qmd
        text: Gestion des Risques
      - href: about.qmd
        text: À propos

execute:
  enabled: false
  except:
    - "**/*.ipynb"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    include-after-body:
      - _layouts/risk-management.html
    toc: true
    toc-location: left
    toc-title: "Sommaire"
    code-fold: true
    code-summary: "Afficher le code"
    df-print: paged

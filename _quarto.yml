project:
  type: website
  output-dir: docs
  resources: img
  render:
    - "*.qmd"
    - "*.ipynb"     # render notebooks as well
    - "!ignored-dir/"

execute:
  cache: true
  freeze: auto

jupyter:
  execute:
    error: false
    warning: false
    message: false

website:
  title: ""
  favicon: img/logo-bg.png
  back-to-top-navigation: true
  navbar:
    logo: img/logo-bg.png
    left:
      - href: index.qmd
        text: Accueil
      - href: index_stat.qmd
        text: Modélisation stat.
      - href: index_gdr.qmd
        text: Gestion des risques
      - href: about.qmd
        text: À propos

format:
  html:
    page-layout: full
    code-fold: true            # improves readability
    code-summary: "Afficher le code"
    theme:
      light: flat
      dark: superhero
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "Sommaire"
    df-print: paged            # better for notebooks
  ipynb: default